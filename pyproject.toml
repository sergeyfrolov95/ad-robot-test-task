[project]
name = 'netspeed'
version = '0.1.0'
description = 'Async download speed benchmark CLI'
requires-python = '>=3.12'
dependencies = [
    'aiohttp>=3.10',
    'typer>=0.12',
]

[project.scripts]
netspeed = 'netspeed.cli:main'

[dependency-groups]
dev = [
    'ruff>=0.8',
    'ty>=0.0.1a6',
    'pytest>=8.0',
    'pytest-asyncio>=0.24',
]

[build-system]
requires = ['uv_build>=0.8.0,<0.9.0']
build-backend = 'uv_build'

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
select = [
    'E',
    'W',
    'F',
    'I',
    'N',
    'UP',
    'B',
    'A',
    'C4',
    'T20',
    'RET',
    'SIM',
    'TC',
    'PL',
    'RUF',
]
ignore = [
    'PLR0913',
]

[tool.ruff.lint.per-file-ignores]
'tests/*' = ['PLR2004']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'

[tool.ruff.format]
quote-style = 'single'

[tool.ty.src]
include = ['src']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
